<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bütçe Ekle</title>
    <link rel="stylesheet" href="css/still.css">
</head>
<body>

    <nav class="navbar">
        <p>Bütçe Takip Programı</p>
        <ul class="navbar-links">
            <li><a href="index.html" class="active">Ana Sayfa</a></li>
            <li><a href="butce_ekle.html">Bütçe Ekle</a></li>
            <li><a href="butceler.html">Bütçeler</a></li>
        </ul>
        <ul class="navbar-links">
            <li><a href="giris.html">Giriş Yap</a></li>
            <li><a href="kayit.html">Kayıt Ol</a></li>
        </ul>
    </nav>
    
    <main class="container">
    <div class="card card-form">
        <h2>Bütçe Ekle</h2>
        
        <form>
            <div class="form-group">
                <label for="islem-adi">İşlem Adı</label>
                <input type="text" id="islem-adi" placeholder="Örn: Market alışverişi">
            </div>

            <div class="form-group">
                <label for="islem-tarih">İşlem Tarihi</label>
                <input type="number" id="islem-tarih" placeholder="GG/AA/YYYY">
            </div>

            <div class="form-group">
                <label for="islem-acıklama">İşlem Açıklaması</label>
                <input type="text" id="islem-acıklama" placeholder="Örn: Yan Gelir">
            </div>

            <div class="form-group">
                <label for="kategori">Kategori</label>
                <select id="kategori">
                    <option value="gelir">Gelir</option>
                    <option value="gider">Genel Gider</option>
                    <option value="fatura">Fatura</option>
                    <option value="market">Market</option>
                    <option value="Kira">Kira</option>
                </select>
            </div>

            <div class="form-group">
                <label for="miktar">Miktar ($)</label>
                <input type="number" id="miktar" placeholder="0.00">
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Kaydet</button>
                <button type="reset" class="btn btn-secondary">Temizle</button>
            </div>
        </form>
    </div>
</main>
    <footer>
        <p>&copy; Bütçe Takip</p>
    </footer>
    
</body>
</html>
